name: Validar skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Formato, links e OpenAPI
        run: |
          pip install pyyaml
          python3 .github/scripts/check_skills.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Skills reconhecidas pelo instalador
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills add . --list | tee skills-list.txt
          grep -q certillion-api skills-list.txt
          grep -q certillion-flow-api skills-list.txt
